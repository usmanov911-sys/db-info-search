[project]
name = "db-info-search"
version = "0.1.0"
description = "Курсовая работа: поиск информации о самолетах"
requires-python = ">=3.12"
dependencies = ["requests (>=2.34.2,<3.0.0)", "psycopg2-binary (>=2.9.13,<3.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
